<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account - CareerBridge</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-container">
      
      <!-- Left Illustration Panel -->
      <div class="auth-sidebar">
        <a href="index.html" class="auth-sidebar-logo">
          <img src="assets/icons/logo.svg" alt="CareerBridge Logo" style="height: 36px;">
        </a>
        <div class="auth-illustration-wrap">
          <img src="assets/images/login-illustration.png" alt="Student working at laptop with clouds and stars">
        </div>
        <div style="font-size: 0.85rem; color: #1e40af; text-align: center; z-index: 2;">
          Join over 10,000+ ambitious students worldwide
        </div>
      </div>

      <!-- Right Form Panel -->
      <div class="auth-form-panel">
        <div class="auth-header">
          <h2>Create Your Account</h2>
          <p>Start your journey towards a dream career today.</p>
        </div>

        <form id="signup-form">
          <!-- Full Name -->
          <div class="form-group">
            <label class="form-label" for="signup-name">Full Name</label>
            <div class="input-icon-wrap">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
              </span>
              <input type="text" id="signup-name" class="form-input" placeholder="e.g. Sarah Sharma" required>
            </div>
          </div>

          <!-- Email Input -->
          <div class="form-group">
            <label class="form-label" for="signup-email">Email Address</label>
            <div class="input-icon-wrap">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                  <polyline points="22,6 12,13 2,6"/>
                </svg>
              </span>
              <input type="email" id="signup-email" class="form-input" placeholder="e.g. sarah.sharma@example.edu" required>
            </div>
          </div>

          <!-- Password Input -->
          <div class="form-group">
            <label class="form-label" for="signup-password">Password</label>
            <div class="input-icon-wrap">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input type="password" id="signup-password" class="form-input" placeholder="At least 8 characters" required>
              <button type="button" class="input-action-btn password-toggle-btn" data-target="signup-password" aria-label="Toggle password visibility">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Role Selection -->
          <div class="form-group">
            <label class="form-label" for="signup-role">I am joining as a</label>
            <select id="signup-role" class="form-input form-input-noicon" style="cursor: pointer;">
              <option value="student">Student / Early Career Seeker</option>
              <option value="employer">Company / Micro-Internship Mentor</option>
            </select>
          </div>

          <!-- Terms Checkbox -->
          <div class="form-group" style="margin-bottom: 22px;">
            <label class="form-checkbox">
              <input type="checkbox" id="terms-agree" required checked>
              <span>I agree to the <a href="#terms" class="link-orange">Terms of Service</a> & <a href="#privacy" class="link-orange">Privacy Policy</a></span>
            </label>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary-orange btn-block" style="padding: 13px; font-size: 1rem;">
            Create Account
          </button>
        </form>

        <div class="divider-or">
          <span>or sign up with</span>
        </div>

        <!-- Google OAuth Button -->
        <button type="button" class="btn-social google-signin-btn">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          Google
        </button>

        <div class="auth-footer">
          Already have an account? <a href="login.html" class="link-orange">Sign In</a>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
