<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - CareerBridge</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-container">
      
      <!-- Left Illustration Panel -->
      <div class="auth-sidebar">
        <a href="index.html" class="auth-sidebar-logo">
          <img src="assets/icons/logo.svg" alt="CareerBridge Logo" style="height: 36px;">
        </a>
        <div class="auth-illustration-wrap">
          <img src="assets/images/login-illustration.png" alt="Student at desk with clouds">
        </div>
        <div style="font-size: 0.85rem; color: #1e40af; text-align: center; z-index: 2;">
          Fast, secure, and hassle-free account recovery
        </div>
      </div>

      <!-- Right Form Panel -->
      <div class="auth-form-panel">
        <div class="auth-header">
          <h2>Forgot Password?</h2>
          <p>No worries! Enter your registered email address and we'll send you a password reset link.</p>
        </div>

        <div id="forgot-form-container">
          <form id="forgot-password-form">
            <!-- Email Input -->
            <div class="form-group" style="margin-bottom: 24px;">
              <label class="form-label" for="forgot-email">Registered Email Address</label>
              <div class="input-icon-wrap">
                <span class="input-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                    <polyline points="22,6 12,13 2,6"/>
                  </svg>
                </span>
                <input type="email" id="forgot-email" class="form-input" placeholder="e.g. sarah.sharma@example.edu" value="sarah.sharma@example.edu" required>
              </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary-orange btn-block" style="padding: 13px; font-size: 1rem;">
              Send Reset Link
            </button>
          </form>
        </div>

        <!-- Animated Success Box (revealed on submit) -->
        <div id="forgot-success-box" style="display: none; text-align: center; padding: 24px 16px; background: #ecfdf5; border: 1.5px solid #a7f3d0; border-radius: var(--radius-lg); margin-bottom: 20px;">
          <div class="ico-tile" style="font-size: 2.4rem; margin-bottom: 8px;"><svg class="ui-i" width="33" height="33" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div>
          <h3 style="font-size: 1.2rem; color: #065f46; margin-bottom: 6px;">Reset Link Sent!</h3>
          <p style="font-size: 0.9rem; color: #047857; margin-bottom: 14px;">
            We've sent an email to <strong id="sent-email-target">your email</strong> with instructions to reset your password.
          </p>
          <a href="login.html" class="btn btn-primary-blue btn-sm">Return to Login</a>
        </div>

        <div class="auth-footer" style="margin-top: 32px;">
          <a href="login.html" class="link-orange" style="display: inline-flex; align-items: center; gap: 6px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to Login
          </a>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
